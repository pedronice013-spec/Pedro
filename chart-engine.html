<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analytics | Crypto Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        .indicator-label { font-size: 10px; font-weight: 800; color: #6b7280; letter-spacing: 0.1em; }
        .chart-container { background: rgba(10, 10, 10, 0.8); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-[#050505] text-white p-4 md:p-6">
    <header class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tighter">BTC/USDT <span class="text-blue-500 text-sm ml-2">ADVANCED VIEW</span></h1>
            <div id="liveTicker" class="text-2xl font-mono font-black text-green-400">$00,000.00</div>
        </div>
        <div class="flex gap-2 bg-white/5 p-1 rounded-lg">
            <button onclick="ChartEngine.switchTF('15m')" class="px-3 py-1 rounded text-[10px] hover:bg-white/10">15M</button>
            <button onclick="ChartEngine.switchTF('1h')" class="px-3 py-1 rounded text-[10px] bg-blue-600/20 text-blue-400 border border-blue-500/20">1H</button>
            <button onclick="ChartEngine.switchTF('4h')" class="px-3 py-1 rounded text-[10px] hover:bg-white/10">4H</button>
        </div>
    </header>

    <div class="grid grid-cols-1 gap-4">
        <div class="chart-container rounded-xl p-4">
            <div class="indicator-label mb-2 uppercase">Candlestick + EMA</div>
            <div id="priceChart" style="height: 400px;"></div>
        </div>

        <div class="chart-container rounded-xl p-4">
            <div class="indicator-label mb-2 uppercase">Relative Strength Index (RSI 14)</div>
            <div style="height: 120px;"><canvas id="rsiChart"></canvas></div>
        </div>

        <div class="chart-container rounded-xl p-4">
            <div class="indicator-label mb-2 uppercase">MACD (12, 26, 9)</div>
            <div style="height: 120px;"><canvas id="macdChart"></canvas></div>
        </div>
    </div>

    <script src="shared/data-service.js"></script>
    <script src="js/chart-logic.js"></script>
</body>
</html>
