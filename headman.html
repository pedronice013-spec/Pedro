<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headman AI | Crypto Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .neural-bg { background: #0a0a0a; background-image: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%); }
        .live-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="neural-bg text-gray-100">
    <main class="p-6 min-h-screen max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-3">
                    <span class="text-blue-500">🧠</span> Headman <span class="text-blue-400">AI</span>
                </h1>
                <p class="text-xs font-mono text-gray-500 uppercase tracking-widest mt-1">Neural Prediction Engine v3.2</p>
            </div>
            <div id="modelStatus" class="px-4 py-2 rounded-full bg-blue-500/10 border border-blue-500/20 text-[10px] font-bold text-blue-400 animate-pulse">
                MODEL: ACTIVE_LEARNING
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2 glass-panel p-8 relative overflow-hidden border-t-2 border-blue-500">
                <div class="flex justify-between items-start mb-10">
                    <div>
                        <h2 class="text-gray-500 text-xs font-bold uppercase tracking-tighter mb-2">Primary Market Outlook</h2>
                        <div class="text-4xl font-black italic tracking-tighter text-white" id="aiOutlook">ANALYZING...</div>
                        <div class="mt-4 flex items-center gap-4">
                            <div class="text-sm font-mono text-blue-400" id="aiConfidence">Confidence: --%</div>
                            <div class="h-1 w-24 bg-gray-800 rounded-full"><div id="confidenceBar" class="h-full bg-blue-500 transition-all duration-1000" style="width: 0%"></div></div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-gray-500 font-bold uppercase">RSI Signal</div>
                        <div class="text-2xl font-mono" id="rsiVal">--</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                        <div class="text-[10px] text-gray-500 mb-1">MACD HIST</div>
                        <div class="text-lg font-mono font-bold" id="macdHist">0.00</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                        <div class="text-[10px] text-gray-500 mb-1">VOLATILITY</div>
                        <div class="text-lg font-mono font-bold text-orange-400">HIGH</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                        <div class="text-[10px] text-gray-500 mb-1">SENTIMENT</div>
                        <div class="text-lg font-mono font-bold text-green-400">BULLISH</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                        <div class="text-[10px] text-gray-500 mb-1">PREDICTED MOVE</div>
                        <div class="text-lg font-mono font-bold text-blue-400">+1.24%</div>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-6 border-t-2 border-purple-500">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-4 tracking-widest">AI Reasoning Log</h3>
                <div id="aiLog" class="space-y-3 h-[300px] overflow-hidden font-mono text-[11px]">
                    </div>
            </div>
        </div>

        <div class="glass-panel p-6">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-6">Learning Curve (Past 30 Days)</h3>
            <div class="h-64"><canvas id="perfChart"></canvas></div>
        </div>
    </main>

    <script src="data-service.js"></script>
    <script>
        const Headman = {
            init: () => {
                Headman.initChart();
                Headman.listen();
            },

            listen: () => {
                DataService.on('candle', (data) => {
                    if (data.indicators) {
                        Headman.processNeuralData(data.indicators);
                    }
                });
            },

            processNeuralData: (ind) => {
                const rsi = ind.rsi.toFixed(2);
                const macd = ind.macd.hist.toFixed(2);
                
                // Update UI
                document.getElementById('rsiVal').textContent = rsi;
                document.getElementById('macdHist').textContent = macd;
                
                // Logic-based "AI" Outlook
                let outlook = "NEUTRAL RANGE";
                let confidence = 65;

                if (rsi > 70) { outlook = "OVERBOUGHT REVERSAL"; confidence = 88; }
                else if (rsi < 30) { outlook = "OVERSOLD BOUNCE"; confidence = 82; }
                else if (macd > 0) { outlook = "BULLISH MOMENTUM"; confidence = 74; }

                document.getElementById('aiOutlook').textContent = outlook;
                document.getElementById('aiConfidence').textContent = `Confidence: ${confidence}%`;
                document.getElementById('confidenceBar').style.width = `${confidence}%`;

                // Log Reasoning based on actual data
                if (Math.abs(macd) > 5) {
                    Headman.log(`MACD Divergence detected: ${macd}. Shifting bias.`, 'blue');
                }
            },

            log: (msg, color) => {
                const container = document.getElementById('aiLog');
                const entry = document.createElement('div');
                entry.className = `p-2 border-l-2 border-${color}-500 bg-white/5 mb-2 animate-pulse`;
                entry.innerHTML = `<span class="text-gray-600">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
                container.prepend(entry);
                if (container.children.length > 6) container.lastChild.remove();
            },

            initChart: () => {
                new Chart(document.getElementById('perfChart'), {
                    type: 'line',
                    data: {
                        labels: ['W1', 'W2', 'W3', 'W4'],
                        datasets: [{
                            label: 'Model Accuracy',
                            data: [72, 75, 74, 78.4],
                            borderColor: '#3b82f6',
                            tension: 0.4
                        }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }
        };
        document.addEventListener('DOMContentLoaded', Headman.init);
    </script>
</body>
</html>
