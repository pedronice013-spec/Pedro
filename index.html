<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Crypto Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .price-up { color: #10b981; }
        .price-down { color: #ef4444; }
        .tab-active { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-[#0a0a0a] text-gray-100">
    
    <main class="p-4 md:p-6 min-h-screen max-w-[1600px] mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Market Terminal</h1>
                <p class="text-sm text-gray-500">Live Execution Environment</p>
            </div>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition-all" onclick="location.reload()">↻ Refresh</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="glass-panel p-4 border-l-4 border-blue-500">
                <div class="text-xs text-gray-500 uppercase font-bold mb-1">BTC / USDT</div>
                <div class="text-2xl font-mono font-bold" id="btcPrice">Loading...</div>
                <div class="text-sm" id="btcChange">--%</div>
            </div>
            <div class="glass-panel p-4">
                <div class="text-xs text-gray-500 uppercase font-bold mb-1">Market Sentiment</div>
                <div class="text-2xl font-bold text-yellow-400" id="fngValue">--</div>
                <div class="text-xs text-gray-400 uppercase tracking-widest" id="fngLabel">FETCHING...</div>
            </div>
            <div class="glass-panel p-4">
                <div class="text-xs text-gray-500 uppercase font-bold mb-1">Global Vol (24h)</div>
                <div class="text-2xl font-mono font-bold text-purple-400" id="totalVolume">$72.4B</div>
                <div class="text-xs text-gray-500">Total Crypto Cap</div>
            </div>
            <div class="glass-panel p-4">
                <div class="text-xs text-gray-500 uppercase font-bold mb-1">System Status</div>
                <div class="flex items-center gap-2 mt-2">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
                    <span class="text-sm font-mono text-green-500 uppercase">Operational</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass-panel p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold flex items-center gap-2">
                        <span class="w-2 h-4 bg-blue-500 rounded-full"></span>
                        Price Action
                    </h2>
                    <div class="flex gap-1 bg-black/40 p-1 rounded-lg border border-white/5" id="tfSwitcher">
                        <button onclick="app.setTF('15m')" class="px-3 py-1 rounded text-[10px] uppercase font-bold transition-all">15m</button>
                        <button onclick="app.setTF('1h')" class="px-3 py-1 rounded text-[10px] uppercase font-bold tab-active transition-all">1h</button>
                        <button onclick="app.setTF('4h')" class="px-3 py-1 rounded text-[10px] uppercase font-bold transition-all">4h</button>
                        <button onclick="app.setTF('1d')" class="px-3 py-1 rounded text-[10px] uppercase font-bold transition-all">1d</button>
                    </div>
                </div>
                <div id="mainChart" style="height: 450px;" class="w-full"></div>
            </div>

            <div class="glass-panel p-4">
                <h2 class="font-bold mb-4 uppercase text-xs tracking-widest text-gray-500">Market Watchlist</h2>
                <div id="marketList" class="space-y-3">
                    <div class="animate-pulse flex justify-between p-2"><div class="h-4 w-20 bg-gray-800 rounded"></div><div class="h-4 w-12 bg-gray-800 rounded"></div></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <a href="news.html" class="glass-panel p-4 hover:bg-white/5 transition-all text-center group">
                <div class="text-xl group-hover:scale-110 transition-transform">📰</div>
                <div class="text-xs font-bold mt-2 uppercase text-gray-400">Terminal News</div>
            </a>
            <a href="headman.html" class="glass-panel p-4 hover:bg-white/5 transition-all text-center group">
                <div class="text-xl group-hover:scale-110 transition-transform">⚡</div>
                <div class="text-xs font-bold mt-2 uppercase text-gray-400">AI Prediction Engine </div>
            </a>
            <a href="chart-engine.html" class="glass-panel p-4 hover:bg-white/5 transition-all text-center group">
                <div class="text-xl group-hover:scale-110 transition-transform">📊</div>
                <div class="text-xs font-bold mt-2 uppercase text-gray-400">chart engine</div>
            </a>
            <a href="services.html" class="glass-panel p-4 hover:bg-white/5 transition-all text-center group">
                <div class="text-xl group-hover:scale-110 transition-transform">🧮</div>
                <div class="text-xs font-bold mt-2 uppercase text-gray-400">Calculator</div>
            </a>
                      <a href="heatmap.html" class="glass-panel p-4 hover:bg-white/5 transition-all text-center group">
                <div class="text-xl group-hover:scale-110 transition-transform">🔥</div>
                <div class="text-xs font-bold mt-2 uppercase text-gray-400">HeatMap </div>
                </a>
        </div>
    </main>

    <script>
        /**
         * DASHBOARD ENGINE
         */
        const app = {
            chart: null,
            candleSeries: null,
            currentTF: '1h',

            init: () => {
                app.initChart();
                app.fetchPriceData();
                app.fetchWatchlist();
                app.fetchFearGreed();
                
                // Real-time loop
                setInterval(app.fetchPriceData, 10000); // Update every 10s
            },

            initChart: () => {
                const chartElement = document.getElementById('mainChart');
                app.chart = LightweightCharts.createChart(chartElement, {
                    layout: { background: { color: 'transparent' }, textColor: '#6b7280', fontSize: 11 },
                    grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
                    rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                    timeScale: { borderColor: 'rgba(255,255,255,0.1)' },
                });

                app.candleSeries = app.chart.addCandlestickSeries({
                    upColor: '#10b981', downColor: '#ef4444',
                    borderUpColor: '#10b981', borderDownColor: '#ef4444',
                    wickUpColor: '#10b981', wickDownColor: '#ef4444'
                });

                window.addEventListener('resize', () => {
                    app.chart.applyOptions({ width: chartElement.clientWidth });
                });
            },

            setTF: (tf) => {
                app.currentTF = tf;
                // Update UI buttons
                document.querySelectorAll('#tfSwitcher button').forEach(btn => {
                    btn.classList.remove('tab-active');
                    if(btn.innerText.toLowerCase() === tf) btn.classList.add('tab-active');
                });
                app.fetchPriceData();
            },

            fetchPriceData: async () => {
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${app.currentTF}&limit=100`);
                    const data = await response.json();
                    const candles = data.map(d => ({
                        time: d[0] / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    app.candleSeries.setData(candles);
                    
                    // Update main BTC display
                    const lastClose = candles[candles.length - 1].close;
                    document.getElementById('btcPrice').textContent = `$${lastClose.toLocaleString()}`;
                } catch (e) { console.error("Chart Error", e); }
            },

            fetchWatchlist: async () => {
                const symbols = ['ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT', 'ADAUSDT'];
                const list = document.getElementById('marketList');
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${JSON.stringify(symbols)}`);
                    const data = await response.json();
                    
                    list.innerHTML = data.map(coin => `
                        <div class="flex justify-between items-center p-3 rounded-lg bg-white/5 border border-white/5">
                            <div>
                                <div class="text-xs font-bold font-mono">${coin.symbol.replace('USDT', '')}</div>
                                <div class="text-[10px] text-gray-500 uppercase">Binance</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold font-mono">$${parseFloat(coin.lastPrice).toLocaleString()}</div>
                                <div class="text-[10px] ${parseFloat(coin.priceChangePercent) >= 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${parseFloat(coin.priceChangePercent).toFixed(2)}%
                                </div>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { console.error("Watchlist Error", e); }
            },

            fetchFearGreed: async () => {
                try {
                    const r = await fetch('https://api.alternative.me/fng/');
                    const res = await r.json();
                    const val = res.data[0];
                    document.getElementById('fngValue').innerText = val.value;
                    document.getElementById('fngLabel').innerText = val.value_classification;
                } catch (e) { console.error("F&G Error", e); }
            }
        };

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
