<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Heatmap | Crypto Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .heat-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .heat-card:hover { transform: scale(1.03); z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Intensity Shaders */
        .gain-strong { background-color: #064e3b; color: #6ee7b7; } /* Deep Green */
        .gain-mid { background-color: #065f46; color: #a7f3d0; }
        .gain-light { background-color: #047857; color: #d1fae5; }
        
        .loss-strong { background-color: #7f1d1d; color: #fca5a5; } /* Deep Red */
        .loss-mid { background-color: #991b1b; color: #fecaca; }
        .loss-light { background-color: #b91c1c; color: #fee2e2; }
        
        .neutral { background-color: #1f2937; color: #9ca3af; }
    </style>
</head>
<body class="bg-[#050505] text-white">
    <main class="p-6">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter">Market <span class="text-green-500">Heatmap</span></h1>
                <p class="text-xs text-gray-500 font-mono">24H PERFORMANCE • REAL-TIME AGGREGATE</p>
            </div>
            <div class="flex gap-4 text-[10px] font-bold">
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500"></span> GAIN</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-red-500"></span> LOSS</div>
            </div>
        </header>

        <div id="heatmapContainer" class="heatmap-grid">
            <div class="animate-pulse bg-gray-900 aspect-square rounded-xl"></div>
            <div class="animate-pulse bg-gray-900 aspect-square rounded-xl"></div>
            <div class="animate-pulse bg-gray-900 aspect-square rounded-xl"></div>
        </div>
    </main>

    
    <script>
        const Heatmap = {
            symbols: [
                'BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT', 
                'ADAUSDT', 'AVAXUSDT', 'DOGEUSDT', 'DOTUSDT', 'LINKUSDT',
                'MATICUSDT', 'SHIBUSDT', 'LTCUSDT', 'NEARUSDT', 'UNIUSDT',
                'ARBUSDT', 'TIAUSDT', 'OPUSDT', 'INJUSDT', 'PEPEUSDT'
            ],

            init: () => {
                Heatmap.fetchData();
                // Refresh every 30 seconds for the heatmap
                setInterval(Heatmap.fetchData, 30000);
            },

            fetchData: async () => {
                try {
                    // Fetching 24h ticker data for all symbols at once
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${JSON.stringify(Heatmap.symbols)}`);
                    const data = await response.json();
                    Heatmap.render(data);
                } catch (err) {
                    console.error("Heatmap Fetch Error:", err);
                }
            },

            getHeatClass: (change) => {
                const val = parseFloat(change);
                if (val >= 5) return 'gain-strong';
                if (val >= 2) return 'gain-mid';
                if (val > 0) return 'gain-light';
                if (val <= -5) return 'loss-strong';
                if (val <= -2) return 'loss-mid';
                if (val < 0) return 'loss-light';
                return 'neutral';
            },

            render: (data) => {
                const container = document.getElementById('heatmapContainer');
                
                container.innerHTML = data.map(coin => {
                    const change = parseFloat(coin.priceChangePercent).toFixed(2);
                    const symbol = coin.symbol.replace('USDT', '');
                    const heatClass = Heatmap.getHeatClass(change);
                    const price = parseFloat(coin.lastPrice).toLocaleString();

                    return `
                        <div class="heat-card rounded-xl ${heatClass}">
                            <div class="text-xs font-black opacity-60 mb-1">${symbol}</div>
                            <div class="text-xl font-bold tracking-tighter">${change}%</div>
                            <div class="text-[9px] font-mono mt-2 opacity-80">$${price}</div>
                        </div>
                    `;
                }).join('');
            }
        };

        document.addEventListener('DOMContentLoaded', Heatmap.init);
    </script>
</body>
</html>
