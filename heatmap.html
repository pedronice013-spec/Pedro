<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Heatmap | Crypto Command Center</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a0a;
      --surface2: #141414;
      --border: #1f1f1f;
      --green: #00ff88;
      --red: #ff4466;
      --yellow: #fbbf24;
      --accent: #00e5ff;
      --muted: #64748b;
    }
    
    body {
      background: var(--bg);
      color: white;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }
    
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }
    
    @media (max-width: 768px) {
      .heatmap-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 6px;
      }
    }
    
    .heat-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    
    .heat-card:hover { 
      transform: scale(1.02); 
      z-index: 10; 
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border-color: rgba(255,255,255,0.2);
    }
    
    .heat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .heat-card:hover::before {
      opacity: 1;
    }
    
    /* Gain Shaders - 5 levels */
    .gain-extreme { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); color: #34d399; }
    .gain-strong { background: linear-gradient(135deg, #065f46 0%, #047857 100%); color: #6ee7b7; }
    .gain-mid { background: linear-gradient(135deg, #047857 0%, #059669 100%); color: #a7f3d0; }
    .gain-light { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #d1fae5; }
    .gain-slight { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); color: #ecfdf5; }
    
    /* Loss Shaders - 5 levels */
    .loss-extreme { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); color: #fca5a5; }
    .loss-strong { background: linear-gradient(135deg, #991b1b 0%, #b91c1c 100%); color: #fecaca; }
    .loss-mid { background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%); color: #fee2e2; }
    .loss-light { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); color: #fef2f2; }
    .loss-slight { background: linear-gradient(135deg, #ef4444 0%, #f87171 100%); color: #fff1f2; }
    
    .neutral { background: linear-gradient(135deg, #1f2937 0%, #374151 100%); color: #9ca3af; }
    
    .loading-skeleton {
      background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .timeframe-btn {
      padding: 6px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .timeframe-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .timeframe-btn.active {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .stats-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    
    .search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: white;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .search-input:focus {
      border-color: var(--accent);
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }
    
    .category-tab {
      padding: 8px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .category-tab:hover {
      border-color: var(--border);
      color: white;
    }
    
    .category-tab.active {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .vol-indicator {
      position: absolute;
      bottom: 8px;
      right: 8px;
      font-size: 9px;
      opacity: 0.7;
    }
    
    .rank-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 9px;
      font-family: 'Space Mono', monospace;
      opacity: 0.6;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .tooltip {
      position: absolute;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: none;
      min-width: 150px;
    }
    
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    
    .tooltip-label {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
    
    .tooltip-value {
      font-family: 'Space Mono', monospace;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="p-6 max-w-[1600px] mx-auto">
    <!-- Header -->
    <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
      <div>
        <h1 class="text-3xl font-black uppercase tracking-tighter mb-1">
          Market <span style="color: var(--green);">Heatmap</span>
        </h1>
        <p class="text-xs font-mono" style="color: var(--muted);">REAL-TIME PERFORMANCE VISUALIZATION</p>
      </div>
      
      <div class="flex flex-wrap gap-3 items-center">
        <!-- Search -->
        <input type="text" class="search-input" id="searchInput" placeholder="Search coin...">
        
        <!-- Timeframe Selector -->
        <div class="flex gap-1" id="timeframeSelector">
          <button class="timeframe-btn active" data-tf="1h">1H</button>
          <button class="timeframe-btn" data-tf="24h">24H</button>
          <button class="timeframe-btn" data-tf="7d">7D</button>
        </div>
      </div>
    </header>
    
    <!-- Category Tabs -->
    <div class="flex gap-2 mb-4 flex-wrap" id="categoryTabs">
      <button class="category-tab active" data-cat="all">All Coins</button>
      <button class="category-tab" data-cat="layer1">Layer 1</button>
      <button class="category-tab" data-cat="defi">DeFi</button>
      <button class="category-tab" data-cat="meme">Meme</button>
      <button class="category-tab" data-cat="ai">AI</button>
    </div>
    
    <!-- Stats Bar -->
    <div class="stats-bar mb-4 flex flex-wrap gap-6 justify-between items-center">
      <div class="flex gap-6">
        <div>
          <div class="text-[10px] font-mono uppercase" style="color: var(--muted);">Total Coins</div>
          <div class="text-lg font-bold font-mono" id="totalCoins">—</div>
        </div>
        <div>
          <div class="text-[10px] font-mono uppercase" style="color: var(--muted);">Gainers</div>
          <div class="text-lg font-bold font-mono" style="color: var(--green);" id="totalGainers">—</div>
        </div>
        <div>
          <div class="text-[10px] font-mono uppercase" style="color: var(--muted);">Losers</div>
          <div class="text-lg font-bold font-mono" style="color: var(--red);" id="totalLosers">—</div>
        </div>
        <div>
          <div class="text-[10px] font-mono uppercase" style="color: var(--muted);">Avg Change</div>
          <div class="text-lg font-bold font-mono" id="avgChange">—</div>
        </div>
      </div>
      
      <!-- Legend -->
      <div class="flex gap-3 text-[10px] font-mono">
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background: var(--green);"></span> +5%+</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background: #10b981;"></span> +2%</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background: var(--red);"></span> -5%+</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background: #dc2626;"></span> -2%</div>
      </div>
    </div>
    
    <!-- Heatmap Grid -->
    <div id="heatmapContainer" class="heatmap-grid">
      <div class="loading-skeleton aspect-square rounded-xl"></div>
      <div class="loading-skeleton aspect-square rounded-xl"></div>
      <div class="loading-skeleton aspect-square rounded-xl"></div>
      <div class="loading-skeleton aspect-square rounded-xl"></div>
      <div class="loading-skeleton aspect-square rounded-xl"></div>
      <div class="loading-skeleton aspect-square rounded-xl"></div>
    </div>
    
    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tooltip-row">
        <span class="tooltip-label">Symbol:</span>
        <span class="tooltip-value" id="tt-symbol">—</span>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">Price:</span>
        <span class="tooltip-value" id="tt-price">—</span>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">Change:</span>
        <span class="tooltip-value" id="tt-change">—</span>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">Volume:</span>
        <span class="tooltip-value" id="tt-volume">—</span>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">High/Low:</span>
        <span class="tooltip-value" id="tt-hl">—</span>
      </div>
    </div>
  </main>
  
  <footer class="p-6 text-center text-[10px] font-mono" style="color: var(--muted);">
    Data from Binance API • Updates every 30 seconds
  </footer>

  <script>
    const Heatmap = {
      // 80+ coins organized by category
      coins: {
        layer1: [
          'BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'ADAUSDT', 'AVAXUSDT', 
          'DOTUSDT', 'TRXUSDT', 'NEARUSDT', 'ALGOUSDT', 'FTMUSDT', 'ATOMUSDT',
          'SUIUSDT', 'SEIUSDT', 'TONUSDT', 'ICPUSDT', 'APTUSDT', 'ARBUSDT',
          'OPUSDT', 'MATICUSDT', 'IMXUSDT', 'STRKUSDT', 'ZETAUSDT', 'SCUSDT'
        ],
        defi: [
          'UNIUSDT', 'AAVEUSDT', 'MKRUSDT', 'LDOUSDT', 'CRVUSDT', 'SNXUSDT',
          'COMPUSDT', 'YFIUSDT', 'SUSHIUSDT', '1INCHUSDT', 'DYDXUSDT', 'PENDLEUSDT',
          'JUPUSDT', 'RAYUSDT', 'LRCUSDT', 'BALUSDT', 'CVXUSDT', 'FXSUSDT'
        ],
        meme: [
          'DOGEUSDT', 'SHIBUSDT', 'PEPEUSDT', 'FLOKIUSDT', 'WIFUSDT', 'BONKUSDT',
          'BOMEUSDT', 'DOGEUSDT', 'SHIBUSDT', 'PEPEUSDT', 'WIFUSDT', 'BONKUSDT'
        ],
        ai: [
          'RNDRUSDT', 'FETUSDT', 'AGIXUSDT', 'OCEANUSDT', 'ARKMUSDT', 'WLDUSDT',
          'LPTUSDT', 'TAOUSDT', 'AIOZUSDT', 'NEARUSDT', 'GRTUSDT', 'PHBUSDT'
        ],
        other: [
          'XRPUSDT', 'LINKUSDT', 'LTCUSDT', 'BCHUSDT', 'ETCUSDT', 'XLMUSDT',
          'VETUSDT', 'FILUSDT', 'THETAUSDT', 'XMRUSDT', 'EOSUSDT', 'IOTAUSDT',
          'XTZUSDT', 'KAVAUSDT', 'FLOWUSDT', 'EGLDUSDT', 'QNTUSDT', 'MANAUSDT',
          'SANDUSDT', 'AXSUSDT', 'GALAUSDT', 'CHZUSDT', 'ENJUSDT', 'BATUSDT',
          'ZILUSDT', 'ONEUSDT', 'HNTUSDT', 'DASHUSDT', 'NEOUSDT', 'XEMUSDT'
        ]
      },
      
      currentData: [],
      currentTimeframe: '24h',
      currentCategory: 'all',
      searchQuery: '',
      refreshInterval: null,
      
      init: () => {
        Heatmap.setupEventListeners();
        Heatmap.fetchData();
        Heatmap.refreshInterval = setInterval(Heatmap.fetchData, 30000);
      },
      
      setupEventListeners: () => {
        // Timeframe buttons
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Heatmap.currentTimeframe = btn.dataset.tf;
            Heatmap.fetchData();
          });
        });
        
        // Category tabs
        document.querySelectorAll('.category-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            Heatmap.currentCategory = tab.dataset.cat;
            Heatmap.render(Heatmap.currentData);
          });
        });
        
        // Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
          Heatmap.searchQuery = e.target.value.toLowerCase();
          Heatmap.render(Heatmap.currentData);
        });
        
        // Tooltip follow mouse
        document.addEventListener('mousemove', (e) => {
          const tooltip = document.getElementById('tooltip');
          if (tooltip.style.display === 'block') {
            tooltip.style.left = (e.pageX + 15) + 'px';
            tooltip.style.top = (e.pageY + 15) + 'px';
          }
        });
      },
      
      getActiveSymbols: () => {
        if (Heatmap.currentCategory === 'all') {
          return [...new Set([
            ...Heatmap.coins.layer1,
            ...Heatmap.coins.defi,
            ...Heatmap.coins.meme,
            ...Heatmap.coins.ai,
            ...Heatmap.coins.other
          ])];
        }
        return Heatmap.coins[Heatmap.currentCategory] || [];
      },
      
      fetchData: async () => {
        try {
          const symbols = Heatmap.getActiveSymbols();
          const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${JSON.stringify(symbols)}`);
          
          if (!response.ok) throw new Error('API Error');
          
          const data = await response.json();
          Heatmap.currentData = data;
          Heatmap.render(data);
          Heatmap.updateStats(data);
        } catch (err) {
          console.error('Heatmap Fetch Error:', err);
          document.getElementById('heatmapContainer').innerHTML = `
            <div class="col-span-full text-center py-12 text-red-400 font-mono">
              Error loading data. Retrying...<br>
              <button onclick="Heatmap.fetchData()" class="mt-4 px-4 py-2 bg-gray-800 rounded hover:bg-gray-700">Retry Now</button>
            </div>
          `;
        }
      },
      
      getHeatClass: (change) => {
        const val = parseFloat(change);
        if (val >= 10) return 'gain-extreme';
        if (val >= 5) return 'gain-strong';
        if (val >= 2) return 'gain-mid';
        if (val >= 0.5) return 'gain-light';
        if (val > 0) return 'gain-slight';
        if (val <= -10) return 'loss-extreme';
        if (val <= -5) return 'loss-strong';
        if (val <= -2) return 'loss-mid';
        if (val <= -0.5) return 'loss-light';
        if (val < 0) return 'loss-slight';
        return 'neutral';
      },
      
      formatPrice: (price) => {
        const num = parseFloat(price);
        if (num >= 1000) return '$' + num.toLocaleString('en-US', { maximumFractionDigits: 0 });
        if (num >= 1) return '$' + num.toFixed(2);
        if (num >= 0.01) return '$' + num.toFixed(4);
        return '$' + num.toExponential(2);
      },
      
      formatVolume: (vol) => {
        const num = parseFloat(vol);
        if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num.toFixed(0);
      },
      
      render: (data) => {
        const container = document.getElementById('heatmapContainer');
        
        // Filter by search
        let filtered = data;
        if (Heatmap.searchQuery) {
          filtered = data.filter(coin => 
            coin.symbol.toLowerCase().includes(Heatmap.searchQuery)
          );
        }
        
        // Sort by change % (absolute)
        filtered.sort((a, b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)));
        
        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12" style="color: var(--muted);">
              No coins found matching "${Heatmap.searchQuery}"
            </div>
          `;
          return;
        }
        
        container.innerHTML = filtered.map((coin, index) => {
          const change = parseFloat(coin.priceChangePercent).toFixed(2);
          const symbol = coin.symbol.replace('USDT', '');
          const heatClass = Heatmap.getHeatClass(change);
          const price = Heatmap.formatPrice(coin.lastPrice);
          const volume = Heatmap.formatVolume(coin.volume);
          const high = Heatmap.formatPrice(coin.highPrice);
          const low = Heatmap.formatPrice(coin.lowPrice);
          
          return `
            <div class="heat-card ${heatClass}" 
                 data-symbol="${symbol}"
                 data-price="${price}"
                 data-change="${change}%"
                 data-volume="$${volume}"
                 data-hl="${high} / ${low}"
                 onmouseenter="Heatmap.showTooltip(this)"
                 onmouseleave="Heatmap.hideTooltip()">
              <span class="rank-badge">#${index + 1}</span>
              <div class="text-xs font-black opacity-70 mb-1 tracking-wider">${symbol}</div>
              <div class="text-2xl font-bold tracking-tighter">${change > 0 ? '+' : ''}${change}%</div>
              <div class="text-[10px] font-mono mt-2 opacity-80">${price}</div>
              <div class="vol-indicator">Vol: $${volume}</div>
            </div>
          `;
        }).join('');
      },
      
      showTooltip: (el) => {
        const tooltip = document.getElementById('tooltip');
        document.getElementById('tt-symbol').textContent = el.dataset.symbol;
        document.getElementById('tt-price').textContent = el.dataset.price;
        document.getElementById('tt-change').textContent = el.dataset.change;
        document.getElementById('tt-change').style.color = el.dataset.change.includes('+') ? 'var(--green)' : 'var(--red)';
        document.getElementById('tt-volume').textContent = el.dataset.volume;
        document.getElementById('tt-hl').textContent = el.dataset.hl;
        tooltip.style.display = 'block';
      },
      
      hideTooltip: () => {
        document.getElementById('tooltip').style.display = 'none';
      },
      
      updateStats: (data) => {
        const gains = data.filter(c => parseFloat(c.priceChangePercent) > 0).length;
        const losses = data.filter(c => parseFloat(c.priceChangePercent) < 0).length;
        const avg = data.reduce((sum, c) => sum + parseFloat(c.priceChangePercent), 0) / data.length;
        
        document.getElementById('totalCoins').textContent = data.length;
        document.getElementById('totalGainers').textContent = gains;
        document.getElementById('totalLosers').textContent = losses;
        document.getElementById('avgChange').textContent = (avg > 0 ? '+' : '') + avg.toFixed(2) + '%';
        document.getElementById('avgChange').style.color = avg >= 0 ? 'var(--green)' : 'var(--red)';
      }
    };

    document.addEventListener('DOMContentLoaded', Heatmap.init);
  </script>
</body>
</html>
